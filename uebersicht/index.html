<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pocket Peasants – Monster-Übersicht</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d16;--panel:#151a2b;--line:#000;--text:#e9e6dc;--muted:#8d93a8;--accent:#ffcb3d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:19px/1.15 VT323,monospace}
header{position:sticky;top:0;z-index:5;background:#0f1322;border-bottom:3px solid #000;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font:14px "Press Start 2P",monospace;color:var(--accent);margin:0 12px 0 0}
input,select{background:#0b0d16;color:var(--text);border:2px solid #000;font:inherit;padding:3px 8px}
.stat{color:var(--muted);font-size:17px}
main{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:var(--panel);border:3px solid #000;box-shadow:3px 3px 0 #000;padding:10px}
.top{display:flex;gap:10px;align-items:center}.pic{position:relative;flex:none;cursor:zoom-in}.top img{width:64px;height:64px;image-rendering:pixelated;background:#0b0d16;border:2px solid #000;display:block}
.zb{position:absolute;right:-6px;bottom:-6px;width:24px;height:24px;padding:0;font-size:14px;line-height:20px;background:var(--accent);color:#000;border:2px solid #000;cursor:pointer;box-shadow:2px 2px 0 #000}
#zoom{position:fixed;inset:0;z-index:20;background:#05060cf0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;cursor:zoom-out}#zoom.on{display:flex}
#zoom .line{display:flex;gap:18px;align-items:flex-end;justify-content:center;flex-wrap:wrap;max-width:96vw}#zoom figure{margin:0;text-align:center}#zoom figure img{image-rendering:pixelated;background:#151a2b;border:3px solid #000;box-shadow:4px 4px 0 #000}
#zoom figure.cur img{border-color:var(--accent)}#zoom figcaption{margin-top:6px;font-size:21px}#zoom figcaption small{display:block;color:var(--muted);font-size:16px}#zoom .arr{font-size:28px;color:var(--muted);align-self:center}#zoom .hint{color:var(--muted);font-size:16px}
.nm{font-size:23px}.chip{display:inline-block;font:9px "Press Start 2P",monospace;color:#fff;padding:3px 5px;border:2px solid #000;margin-right:4px}
.strip{display:flex;align-items:flex-end;gap:4px;margin-top:6px;flex-wrap:wrap}.strip img{height:38px;image-rendering:pixelated;background:#0b0d16;border:2px solid #000;cursor:zoom-in}.strip img.cur{border-color:var(--accent)}.strip span{color:var(--muted);align-self:center}
.law{color:#c9b8ff}.evo{color:var(--muted);font-size:17px;margin-top:4px}.dex{margin-top:6px;font-size:17px;color:#cfd3e0}
details{margin-top:8px}summary{cursor:pointer;color:var(--accent)}ol{margin:6px 0 0;padding-left:22px}li{margin-bottom:6px}
.a{color:#3ddc6b}.src{color:var(--muted);font-size:15px}.none{color:var(--muted);font-size:17px;margin-top:8px}
section.book{grid-column:1/-1}
.tabs{display:flex;gap:6px}.tabs button{font:10px "Press Start 2P",monospace;background:#0b0d16;color:var(--muted);border:2px solid #000;padding:7px 9px;cursor:pointer;box-shadow:2px 2px 0 #000}.tabs button.on{background:var(--accent);color:#000}
main.mv{display:block}table{width:100%;border-collapse:collapse;background:var(--panel);border:3px solid #000;box-shadow:3px 3px 0 #000}th,td{padding:5px 8px;border-bottom:2px solid #0b0d16;text-align:left;vertical-align:top}th{position:sticky;top:58px;background:#0f1322;font:9px "Press Start 2P",monospace;color:var(--accent);cursor:pointer;white-space:nowrap;z-index:2}th.s::after{content:' ▾'}td.num{text-align:right;white-space:nowrap}.ln{color:#cfd3e0}.ds{color:var(--muted);font-size:16px}.by{color:var(--muted);font-size:16px}.tm{font:8px "Press Start 2P",monospace;background:#3a3f5c;color:#fff;padding:2px 4px;border:2px solid #000}
@media(max-width:760px){.hide-s{display:none}}h2{font:12px "Press Start 2P",monospace;color:var(--accent);margin:18px 0 6px}
</style></head><body>
<header><h1 id="ttl">MONSTER-ÜBERSICHT</h1><div class="tabs"><button data-pg="mon" class="on">MONSTER</button><button data-pg="mv">ATTACKEN</button></div>
<input id="q" placeholder="Suche: Name, §, Frage …" size="26">
<select id="ty"><option value="">alle Typen</option></select>
<select id="bk"><option value="">alle Gesetze</option><option>StGB</option><option>StPO</option><option>PolG</option><option>GG</option><option>OWiG</option><option value="-">ohne Paragraf</option></select>
<span class="stat" id="st"></span></header>
<main id="m"></main>
<div id="zoom" role="dialog" aria-label="Vergrößerung"></div>
<script>
const RAR={unique:'einzigartig',common:'häufig',uncommon:'selten',rare:'sehr selten',legendary:'legendär'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null;
function bookOf(l){const m=(l||'').match(/^(?:§|Art\.)\s*\d+[a-z]?\s+([A-Za-zÄÖÜäöü]+)/);return m?m[1]:''}
function qList(qs){return`<ol>${qs.map(q=>`<li>${esc(q[0])}<br><span class="a">✓ ${esc(q[1])}</span>${q[2]?` <span class="src">${esc(q[2])}</span>`:''}</li>`).join('')}</ol>`}
let PG='mon',SORT=['t',1];
function renderMv(){const q=document.getElementById('q').value.trim().toLowerCase(),ty=document.getElementById('ty').value;let L=D.mv.filter(m=>(!ty||m.t===ty)&&(!q||(m.n+' '+m.t+' '+m.kind+' '+m.line+' '+m.by.map(b=>b[0]).join(' ')).toLowerCase().includes(q)));
  const [k,dir]=SORT;L=L.slice().sort((a,b)=>{const x=a[k],y=b[k];return (typeof x==='number'?x-y:String(x).localeCompare(String(y)))*dir||a.n.localeCompare(b.n)});
  const th=(key,lab,cls)=>`<th data-k="${key}" class="${(SORT[0]===key?'s ':'')+(cls||'')}">${lab}</th>`;
  document.getElementById('m').innerHTML=`<table><thead><tr>${th('n','ATTACKE')}${th('t','TYP')}${th('kind','ART','hide-s')}${th('p','STÄRKE')}${th('ap','AP')}${th('cd','ABKL.','hide-s')}<th class="hide-s">LERNEN</th></tr></thead><tbody>${L.map(m=>`<tr><td><b>${esc(m.n)}</b>${m.tm?' <span class="tm">TM</span>':''}<div class="ln">${esc(m.line)}</div><div class="ds">${esc(m.desc)}</div></td><td><span class="chip" style="background:${m.tc}">${esc(m.t.toUpperCase())}</span></td><td class="hide-s">${esc(m.kind)}</td><td class="num">${m.p||'–'}</td><td class="num">${m.ap}</td><td class="num hide-s">${m.cd}s</td><td class="by hide-s">${m.by.length?m.by.slice(0,8).map(b=>esc(b[0])+' (Lv '+b[1]+')').join(', ')+(m.by.length>8?` +${m.by.length-8}`:''):(m.tm?'nur per TM':'–')}</td></tr>`).join('')}</tbody></table>`;
  document.getElementById('st').textContent=`${L.length} von ${D.mv.length} Attacken · Stand v${D.ver}`}
function render(){if(PG==='mv')return renderMv();const q=document.getElementById('q').value.trim().toLowerCase(),ty=document.getElementById('ty').value,bk=document.getElementById('bk').value;
  let h='',n=0,nq=0;
  for(const s of D.sp){const b=bookOf(s.law);if(ty&&s.t!==ty)continue;if(bk&&(bk==='-'?b:b!==bk))continue;
    const hay=(s.n+' '+s.law+' '+s.t+' '+s.q.map(x=>x[0]+' '+x[1]).join(' ')).toLowerCase();if(q&&!hay.includes(q))continue;n++;nq+=s.q.length;
    const qs=q?s.q.filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(q)||(s.n+' '+s.law).toLowerCase().includes(q)):s.q;
    h+=`<div class="card"><div class="top"><div class="pic" data-id="${esc(s.id)}"><img src="${s.img}" alt=""><button class="zb" title="Vergrößern">🔍</button></div><div><div class="nm">${esc(s.n)}</div><span class="chip" style="background:${s.tc}">${esc(s.t.toUpperCase())}</span>${s.rar?`<span class="chip" style="background:#3a3f5c">${esc((RAR[s.rar]||s.rar).toUpperCase())}</span>`:''}${s.law?`<div class="law">${esc(s.law)}</div>`:''}</div></div>
      <div class="strip">${lineOf(s).map(x=>`<img src="${x.img}" alt="" title="${esc(x.n)}" class="${x===s?'cur':''}" data-id="${esc(x.id)}" onload="this.style.height=Math.round(this.naturalHeight*.6)+'px'">`).join('<span>→</span>')}</div>
      <div class="evo">${s.prev?`↖ entwickelt sich aus ${esc(s.prev)}`:''}${s.prev&&s.evo?' · ':''}${s.evo?`→ ab Lv ${s.evo[0]} zu ${esc(s.evo[1])}`:''}${!s.prev&&!s.evo?'keine Entwicklung':''}</div>
      ${s.dex?`<div class="dex">📖 ${esc(s.dex)}</div>`:''}
      ${s.q.length?`<details ${q?'open':''}><summary>${s.q.length} Fragen${b&&D.book[b]&&D.book[b].length?` (+ ${D.book[b].length} allgemeine ${b}-Fragen)`:''}</summary>${qList(qs)}</details>`:`<div class="none">${b&&D.book[b]?`Keine eigenen Fragen – bekommt die ${D.book[b].length} allgemeinen ${b}-Fragen.`:'Keine eigenen Fragen (Quiz zieht zufällige Fragen).'}</div>`}</div>`}
  if(!ty&&!bk){const cs=(D.cases||[]).filter(x=>!q||(x[0]+' '+x[1]).toLowerCase().includes(q));if(cs.length)h+=`<section class="book card"><h2>⚖ FALLFRAGEN (${D.cases.length}) – kurze Fälle, kommen beim Lernen, im Schlaf und in Prüfungen</h2><details ${q?'open':''}><summary>${cs.length} anzeigen</summary>${qList(cs.map(x=>[x[0],x[1],(x[3]?x[3]+' · ':'')+x[2]]))}</details></section>`;
    const sv=(D.stvo||[]).filter(x=>!q||(x[0]+' '+x[1]).toLowerCase().includes(q));if(sv.length)h+=`<section class="book card"><h2>🚦 STVO-FRAGEN (${D.stvo.length}) – Zwischenprüfung bei Prof. Blinker & Co.</h2><details ${q?'open':''}><summary>${sv.length} anzeigen</summary>${qList(sv)}</details></section>`}
  for(const b of ['StGB','StPO','PolG','GG']){if(bk&&bk!==b)continue;const qs=D.book[b].filter(x=>!q||(x[0]+' '+x[1]).toLowerCase().includes(q));if(!qs.length||ty)continue;
    h+=`<section class="book card"><h2>ALLGEMEINE ${b}-FRAGEN (${D.book[b].length}) – ohne passendes Monster, gelten für alle ${b}-Monster und die PMLK</h2><details ${q?'open':''}><summary>${qs.length} anzeigen</summary>${qList(qs)}</details></section>`}
  document.getElementById('m').innerHTML=h||'<div class="none">Nichts gefunden.</div>';
  document.getElementById('st').textContent=`${n} Monster · ${nq} eigene Fragen · ${Object.values(D.book).reduce((a,v)=>a+v.length,0)} allgemeine · ${(D.cases||[]).length} Fälle · ${(D.stvo||[]).length} StVO · Stand v${D.ver}`}
// zoom: the whole evolution line, big and pixel-sharp (click / Esc closes)
function lineOf(s){if(s._line)return s._line;const byN={};for(const x of D.sp)byN[x.n]=x;let r=s,g=0;while(r.prev&&byN[r.prev]&&g++<6)r=byN[r.prev];const L=[r];g=0;while(L[L.length-1].evo&&byN[L[L.length-1].evo[1]]&&g++<6)L.push(byN[L[L.length-1].evo[1]]);for(const x of L)x._line=L;return L}
function zoom(id){const s=D.sp.find(x=>x.id===id);if(!s)return;const L=lineOf(s);const tmp=new Image();
  const fig=(x,i)=>`<figure class="${x===s?'cur':''}"><img src="${x.img}" alt="" data-z="${i}"><figcaption>${esc(x.n)}<small>${i?`ab Lv ${L[i-1].evo[0]}`:'Grundform'}</small></figcaption></figure>`;
  const z=document.getElementById('zoom');z.innerHTML=`<div class="line">${L.map((x,i)=>(i?'<span class="arr">→</span>':'')+fig(x,i)).join('')}</div><div class="hint">Klick oder Esc schließt</div>`;
  // same pixel size for the whole line: scale by the largest that fits
  const ims=[...z.querySelectorAll('figure img')];let left=ims.length;const fit=()=>{const ws=ims.map(i=>i.naturalWidth),hs=ims.map(i=>i.naturalHeight);
    const k=Math.max(2,Math.floor(Math.min((innerWidth*0.92-ims.length*40)/ws.reduce((a,b)=>a+b,0),(innerHeight*0.62)/Math.max(...hs))));ims.forEach(i=>{i.style.width=i.naturalWidth*k+'px';i.style.height=i.naturalHeight*k+'px'})};
  ims.forEach(i=>{if(i.complete)--left||fit();else i.onload=()=>--left||fit()});z.classList.add('on')}
document.getElementById('m').addEventListener('click',e=>{const h=e.target.closest('th[data-k]');if(h){const k=h.dataset.k;SORT=[k,SORT[0]===k?-SORT[1]:(k==='p'||k==='ap'||k==='cd'?-1:1)];renderMv();return}const p=e.target.closest('.pic')||e.target.closest('.strip img');if(p)zoom(p.dataset.id)});
document.getElementById('zoom').addEventListener('click',()=>document.getElementById('zoom').classList.remove('on'));
addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('zoom').classList.remove('on')});
function groupLines(){const seen=new Set(),out=[];for(const s of D.sp){if(seen.has(s.id))continue;for(const x of lineOf(s)){if(!seen.has(x.id)){seen.add(x.id);out.push(x)}}}D.sp=out}
fetch('data.json').then(r=>r.json()).then(d=>{D=d;groupLines();const ts=[...new Set(d.sp.map(s=>s.t))].sort();const sel=document.getElementById('ty');for(const t of ts)sel.insertAdjacentHTML('beforeend',`<option>${esc(t)}</option>`);
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{PG=b.dataset.pg;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));const mv=PG==='mv';document.getElementById('m').className=mv?'mv':'';document.getElementById('bk').style.display=mv?'none':'';document.getElementById('ttl').textContent=mv?'ATTACKEN-ÜBERSICHT':'MONSTER-ÜBERSICHT';document.getElementById('q').placeholder=mv?'Suche: Attacke, Typ, Monster …':'Suche: Name, §, Frage …';if(location.hash!=='#'+PG)history.replaceState(null,'','#'+PG);render()});if(location.hash==='#mv')document.querySelector('[data-pg=mv]').click();
  for(const id of['q','ty','bk'])document.getElementById(id).addEventListener('input',render);render()}).catch(e=>{document.getElementById('m').textContent='Daten konnten nicht geladen werden.'});
</script></body></html>
